name: Build, test and release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Restore and build
        run: |
          dotnet restore LexPercentPro.slnx --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build LexPercentPro.slnx -c Release --no-restore
      - name: Tests
        run: dotnet test tests/LexPercent.Tests -c Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: Publish standalone application
        run: |
          dotnet publish src/LexPercent.UI -c Release -r win-x64 --self-contained true -p:PublishTrimmed=false -o artifacts/LexPercentPro-win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item README.md,CHANGELOG.md,LICENSE artifacts/LexPercentPro-win-x64
      - name: Compile single-file installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            $download = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
            Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $download
            $signature = Get-AuthenticodeSignature $download
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*Pyrsys*') { throw 'Inno Setup signature validation failed' }
            $process = Start-Process $download '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /ALLUSERS' -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw 'Inno Setup installation failed' }
          }
          ./scripts/package.ps1 -Compiler $compiler
      - name: Keep build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LexPercentPro-installer
          path: |
            artifacts/LexPercentPro-Setup-*.exe
            artifacts/LexPercentPro-Setup-*.sha256
            tests/LexPercent.Tests/TestResults/*.trx
          retention-days: 14
      - name: Publish release when version is new
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/LexPercent.UI/LexPercent.UI.csproj
          $version = @($project.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $tag already exists; immutable assets retained."; exit 0 }
          gh release create $tag "artifacts/LexPercentPro-Setup-$version.exe" "artifacts/LexPercentPro-Setup-$version.exe.sha256" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "LexPercent Pro $version" --notes-file docs/Release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed' }
